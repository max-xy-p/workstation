name: workstation

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--sql-generate-invisible-primary-key=OFF"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workstation}
      MYSQL_USER: ${MYSQL_USER:-workstation}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.docker}
      XXL_JOB_DB_USERNAME: ${XXL_JOB_DB_USERNAME:-xxl_job}
      XXL_JOB_DB_PASSWORD: ${XXL_JOB_DB_PASSWORD:?Set XXL_JOB_DB_PASSWORD in .env.docker}
      XXL_JOB_ADMIN_PASSWORD: ${XXL_JOB_ADMIN_PASSWORD:?Set XXL_JOB_ADMIN_PASSWORD in .env.docker}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/migrate-project-integrations.sql:/docker-entrypoint-initdb.d/01a-project-integrations.sql:ro
      - ./backend/src/main/resources/db/migrate-note-revisions.sql:/docker-entrypoint-initdb.d/01b-note-revisions.sql:ro
      - ./backend/src/main/resources/db/migrate-task-issues.sql:/docker-entrypoint-initdb.d/01c-task-issues.sql:ro
      - ./backend/src/main/resources/db/migrate-github-webhooks.sql:/docker-entrypoint-initdb.d/01d-github-webhooks.sql:ro
      - ./backend/src/main/resources/db/migrate-source-confirmation.sql:/docker-entrypoint-initdb.d/01e-source-confirmation.sql:ro
      - ./backend/src/main/resources/db/init-keycloak-database.sh:/docker-entrypoint-initdb.d/02-keycloak.sh:ro
      - ./xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/03-xxl-job.sql:ro
      - ./backend/src/main/resources/db/init-xxl-job-database.sh:/docker-entrypoint-initdb.d/04-xxl-job-user.sh:ro
    healthcheck:
      # mysqladmin ping 在鉴权失败时仍可能返回成功；执行 SQL 才能确认数据库真正可用。
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=tcp --host=127.0.0.1 --user=root --silent --skip-column-names --execute='SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-workstation}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.docker}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    restart: unless-stopped
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://db:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${XXL_JOB_DB_USERNAME:-xxl_job}
        --spring.datasource.password=${XXL_JOB_DB_PASSWORD:?Set XXL_JOB_DB_PASSWORD in .env.docker}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?Set XXL_JOB_ACCESS_TOKEN in .env.docker}
        --xxl-sso.token.key=${XXL_JOB_SSO_TOKEN_KEY:?Set XXL_JOB_SSO_TOKEN_KEY in .env.docker}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - xxl_job_logs:/data/applogs
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname=${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}/auth
    environment:
      # Keycloak 与业务后端共用 MySQL 服务，但使用 keycloak 数据库和独立账号。
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/keycloak?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.docker}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env.docker}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.docker}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env.docker}
      KEYCLOAK_PYTHON_CLIENT_SECRET: ${KEYCLOAK_PYTHON_CLIENT_SECRET:?Set KEYCLOAK_PYTHON_CLIENT_SECRET in .env.docker}
      WORKSTATION_PUBLIC_URL: ${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}
      WORKSTATION_DEV_URL: ${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}
      WORKSTATION_INITIAL_USERNAME: ${WORKSTATION_INITIAL_USERNAME:-owner}
      WORKSTATION_INITIAL_PASSWORD: ${WORKSTATION_INITIAL_PASSWORD:?Set WORKSTATION_INITIAL_PASSWORD in .env.docker}
    volumes:
      - ./keycloak/workstation-realm.json:/opt/keycloak/data/import/workstation-realm.json:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/${GHCR_NAMESPACE:?Set GHCR_NAMESPACE in .env.docker}/workstation-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-workstation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-workstation}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      KEYCLOAK_ISSUER_URI: ${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}/auth/realms/workstation
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/workstation/protocol/openid-connect/certs
      OAUTH2_AUDIENCE: workstation-api
      DASHBOARD_RECENT_LIMIT: ${DASHBOARD_RECENT_LIMIT:-5}
      INTEGRATIONS_ENABLED: ${INTEGRATIONS_ENABLED:-false}
      INTEGRATIONS_KEY_VERSION: ${INTEGRATIONS_KEY_VERSION:-v1}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_PREVIOUS_ENCRYPTION_KEY: ${INTEGRATIONS_PREVIOUS_ENCRYPTION_KEY:-}
      INTEGRATIONS_ALLOWED_GITLAB_INSTANCES: ${INTEGRATIONS_ALLOWED_GITLAB_INSTANCES:-https://gitlab.com}
      INTEGRATIONS_REQUEST_TIMEOUT_SECONDS: ${INTEGRATIONS_REQUEST_TIMEOUT_SECONDS:-15}
      INTEGRATIONS_MAX_PAGES: ${INTEGRATIONS_MAX_PAGES:-500}
      INTEGRATIONS_MAX_ITEMS: ${INTEGRATIONS_MAX_ITEMS:-300}
      INTEGRATIONS_LEASE_SECONDS: ${INTEGRATIONS_LEASE_SECONDS:-180}
      INTEGRATIONS_RECENT_DAYS: ${INTEGRATIONS_RECENT_DAYS:-30}
      NOTE_IMPORT_ALLOWED_ROOTS: /data/notes
      NOTE_IMPORT_MAX_FILE_BYTES: ${NOTE_IMPORT_MAX_FILE_BYTES:-1048576}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-workstation}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.docker}
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?Set XXL_JOB_ACCESS_TOKEN in .env.docker}
      XXL_JOB_EXECUTOR_ADDRESS: http://backend:9999
      XXL_JOB_EXECUTOR_PORT: 9999
      XXL_JOB_EXECUTOR_LOG_PATH: /data/applogs/xxl-job/jobhandler
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./notes:/data/notes
      - xxl_executor_logs:/data/applogs
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ghcr.io/${GHCR_NAMESPACE:?Set GHCR_NAMESPACE in .env.docker}/workstation-gateway:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8081
      BACKEND_BASE_URL: http://backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env.docker}
      OAUTH2_AUDIENCE: workstation-api
      WORKSTATION_PUBLIC_URL: ${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}
      KEYCLOAK_PUBLIC_BASE_URL: ${WORKSTATION_PUBLIC_URL:?Set WORKSTATION_PUBLIC_URL in .env.docker}/auth
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/auth
      SESSION_COOKIE_SECURE: "true"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      keycloak:
        condition: service_started

  web:
    image: ghcr.io/${GHCR_NAMESPACE:?Set GHCR_NAMESPACE in .env.docker}/workstation-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      # 公网 HTTPS 只由宿主机 Nginx 提供，Web 容器入口不直接暴露到 VPS 公网网卡。
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    depends_on:
      - gateway
      - keycloak

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  xxl_job_logs:
  xxl_executor_logs:
