server:
  port: ${GATEWAY_PORT:8081}
  forward-headers-strategy: framework
  reactive:
    session:
      cookie:
        name: WORKSTATION_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: workstation-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: ${SESSION_TIMEOUT:8h}
    redis:
      namespace: workstation:gateway:session
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
          routes:
            # 回调使用签名认证，不接触浏览器 Session 或平台访问 Token。
            - id: workstation-github-webhook
              order: -2
              uri: ${BACKEND_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/hooks/github/*
              filters:
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=Cookie
                - name: RequestSize
                  args:
                    maxSize: 1000000
            # 机器客户端自带 Bearer Token，不经过浏览器 Session 或 Token Relay。
            - id: workstation-backend-bearer
              order: -1
              uri: ${BACKEND_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
                - Header=Authorization, '(?i)Bearer\s+.+'
            # 浏览器请求由 Gateway Session 取得 Access Token，再转发给 Backend。
            - id: workstation-backend-browser
              uri: ${BACKEND_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - SaveSession
                - TokenRelay

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

workstation:
  sso:
    # 浏览器跳转和 Token issuer 使用公开地址；Gateway 后台换 Token/取公钥使用内网地址。
    application-base-url: ${WORKSTATION_PUBLIC_URL:http://localhost:8088}
    public-keycloak-base-url: ${KEYCLOAK_PUBLIC_BASE_URL:http://localhost:8088/auth}
    internal-keycloak-base-url: ${KEYCLOAK_INTERNAL_BASE_URL:http://localhost:8090/auth}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    audience: ${OAUTH2_AUDIENCE:workstation-api}
