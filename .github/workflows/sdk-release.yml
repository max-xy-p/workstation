name: 发布 SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 验证仓库
    uses: ./.github/workflows/ci.yml

  publish:
    name: 构建并发布 SDK 制品
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: 配置 uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: 校验 SDK 发布版本
        run: python scripts/check_sdk_versions.py --tag "$GITHUB_REF_NAME"

      - name: 构建 Python SDK 制品
        run: |
          mkdir -p release/python
          uv build clients/python --out-dir release/python --no-sources
          uv build clients/python-auth --out-dir release/python --no-sources

      - name: 验证 Python wheel
        shell: bash
        run: |
          uv venv .sdk-release-venv
          uv export --project clients/python-auth --locked --no-emit-project --no-emit-local --no-hashes --no-header --no-annotate --output-file .sdk-release-constraints.txt
          uv pip install --no-build --python .sdk-release-venv/bin/python --constraints .sdk-release-constraints.txt release/python/*.whl
          .sdk-release-venv/bin/python -c \
            "from workstation_auth import ClientCredentialsProvider; from workstation_client import AuthenticatedClient"

      - name: 构建 TypeScript SDK 包
        working-directory: clients/typescript
        run: |
          npm ci --ignore-scripts
          npm run api:generate
          npm run typecheck
          npm run build
          npm test
          mkdir -p ../../release/typescript
          npm pack --pack-destination ../../release/typescript

      - name: 生成制品校验和
        shell: bash
        run: |
          find release -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > release/SHA256SUMS

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Workstation SDK ${GITHUB_REF_NAME#sdk-v}"
