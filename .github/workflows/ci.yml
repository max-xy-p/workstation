name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell and configuration files
        run: |
          bash -n backend/src/main/resources/db/init-keycloak-database.sh
          jq empty keycloak/workstation-realm.json
          docker compose --env-file .env.docker.example config --quiet
          docker compose --env-file .env.docker.example -f compose.prod.yaml config --quiet

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw --batch-mode verify

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify gateway
        run: mvn --batch-mode verify

  openapi:
    name: OpenAPI and Python client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI document
        uses: oasdiff/oasdiff-action/validate@v0.1.10
        with:
          spec: openapi/workstation.yaml
          fail-on: ERR

      - name: Locate base OpenAPI document
        if: github.event_name == 'pull_request'
        id: base-openapi
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:openapi/workstation.yaml" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request' && steps.base-openapi.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.10
        with:
          base: origin/${{ github.base_ref }}:openapi/workstation.yaml
          revision: HEAD:openapi/workstation.yaml
          fail-on: ERR
          review: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Regenerate Python client
        run: >-
          uvx --from openapi-python-client==0.29.1 openapi-python-client generate
          --path openapi/workstation.yaml
          --config openapi/python-client-config.yaml
          --meta uv
          --output-path clients/python
          --overwrite
          --fail-on-warning

      - name: Check generated client drift
        shell: bash
        run: |
          git diff --exit-code -- clients/python
          test -z "$(git status --short --untracked-files=all -- clients/python)"

      - name: Install locked Python client dependencies
        run: uv sync --project clients/python-auth --locked

      - name: Test Client Credentials adapter
        run: uv run --project clients/python-auth python -m unittest discover -s clients/python-auth/tests -v

  frontend:
    name: TypeScript SDK and frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm --prefix ../clients/typescript ci

      - name: Regenerate and build TypeScript SDK
        run: |
          npm --prefix ../clients/typescript run api:generate
          npm --prefix ../clients/typescript run typecheck
          npm --prefix ../clients/typescript run build
          npm --prefix ../clients/typescript test

      - name: Check generated TypeScript SDK drift
        shell: bash
        run: |
          git diff --exit-code -- ../clients/typescript/src/generated/schema.ts ../clients/typescript/dist
          test -z "$(git status --short --untracked-files=all -- ../clients/typescript/src/generated/schema.ts ../clients/typescript/dist)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend API contract
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker:
    name: Docker build - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - configuration
      - backend
      - gateway
      - openapi
      - frontend

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
          - name: web
            context: .
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: workstation-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
