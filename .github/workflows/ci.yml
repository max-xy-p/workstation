name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate shell and configuration files
        run: |
          bash -n backend/src/main/resources/db/init-keycloak-database.sh
          jq empty keycloak/workstation-realm.json
          docker compose --env-file .env.docker.example config --quiet
          docker compose --env-file .env.docker.example -f compose.prod.yaml config --quiet

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw --batch-mode verify

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify gateway
        run: mvn --batch-mode verify

  openapi:
    name: OpenAPI and Python client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI document
        uses: oasdiff/oasdiff-action/validate@0ab8ad204b00d25acc5ae87106281433e288d0c1 # v0.1.10
        with:
          spec: openapi/workstation.yaml
          fail-on: ERR

      - name: Locate base OpenAPI document
        if: github.event_name == 'pull_request'
        id: base-openapi
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:openapi/workstation.yaml" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request' && steps.base-openapi.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@0ab8ad204b00d25acc5ae87106281433e288d0c1 # v0.1.10
        with:
          base: origin/${{ github.base_ref }}:openapi/workstation.yaml
          revision: HEAD:openapi/workstation.yaml
          fail-on: ERR
          review: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: 检查 SDK 版本一致性
        run: |
          python scripts/check_sdk_versions.py
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("clients/python/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"SDK_VERSION={version}\n")
          PY

      - name: Regenerate Python client
        run: >-
          uvx --no-build --from openapi-python-client==0.29.1 openapi-python-client generate
          --path openapi/workstation.yaml
          --config openapi/python-client-config.yaml
          --meta uv
          --output-path clients/python
          --overwrite
          --fail-on-warning

      - name: Check generated client drift
        shell: bash
        run: |
          git diff --exit-code -- clients/python
          test -z "$(git status --short --untracked-files=all -- clients/python)"

      - name: 安装锁定的第三方 Python 依赖
        run: uv sync --project clients/python-auth --locked --no-build --no-install-local

      - name: 构建仓库内的 Python SDK 与认证层
        run: |
          uv build --wheel clients/python --out-dir .ci-wheels
          uv build --wheel clients/python-auth --out-dir .ci-wheels

      - name: 安装并检查本地 Python wheel
        run: |
          uv pip install --python clients/python-auth/.venv/bin/python --no-deps --no-build --offline \
            "./.ci-wheels/workstation_api_client-${SDK_VERSION}-py3-none-any.whl" \
            "./.ci-wheels/workstation_client_credentials-${SDK_VERSION}-py3-none-any.whl"
          uv pip check --python clients/python-auth/.venv/bin/python

      - name: Test Client Credentials adapter
        run: uv run --project clients/python-auth --locked --no-sync --no-build python -m unittest discover -s clients/python-auth/tests -v

  frontend:
    name: TypeScript SDK and frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm --prefix ../clients/typescript ci --ignore-scripts

      - name: Regenerate and build TypeScript SDK
        run: |
          npm --prefix ../clients/typescript run api:generate
          npm --prefix ../clients/typescript run typecheck
          npm --prefix ../clients/typescript run build
          npm --prefix ../clients/typescript test

      - name: Check generated TypeScript SDK drift
        shell: bash
        run: |
          git diff --exit-code -- ../clients/typescript/src/generated/schema.ts ../clients/typescript/dist
          test -z "$(git status --short --untracked-files=all -- ../clients/typescript/src/generated/schema.ts ../clients/typescript/dist)"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Type-check frontend API contract
        run: npm run typecheck

      - name: 验证前端导航与表单交互状态
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  sonar:
    name: SonarQube analysis
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs:
      - backend
      - gateway
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            clients/typescript/package-lock.json

      - name: Run Java tests and generate JaCoCo reports
        run: |
          mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
          mvn --batch-mode --no-transfer-progress -f gateway/pom.xml verify

      - name: Enforce 80% combined Backend and Gateway coverage
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_java_coverage.py

      - name: Install frontend and TypeScript SDK dependencies
        run: |
          npm --prefix clients/typescript ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts

      - name: Scan repository
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker build - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - configuration
      - backend
      - gateway
      - openapi
      - frontend

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
          - name: web
            context: .
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: workstation-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
