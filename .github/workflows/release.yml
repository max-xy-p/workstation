name: Publish container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag for a manual publication
        required: true
        default: edge
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: workstation-backend
          - name: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
            image: workstation-gateway
          - name: web
            context: .
            dockerfile: ./frontend/Dockerfile
            image: workstation-web
          - name: mail-service
            context: ./mail-service
            dockerfile: ./mail-service/Dockerfile
            image: workstation-mail-service
          - name: keycloak
            context: ./keycloak
            dockerfile: ./keycloak/Dockerfile
            image: workstation-keycloak

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.image_tag || 'edge' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: read

    concurrency:
      group: workstation-production
      cancel-in-progress: false

    env:
      DEPLOY_PATH: /opt/workstation
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment settings
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag"
            exit 1
          fi
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" ]]; then
            echo "VPS_HOST and VPS_USER secrets are required"
            exit 1
          fi
          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_PORT must be a valid TCP port"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "VPS_SSH_PRIVATE_KEY and VPS_SSH_KNOWN_HOSTS secrets are required"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        shell: bash
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH/backend/src/main/resources/db' '$DEPLOY_PATH/keycloak' '$DEPLOY_PATH/notes' '$DEPLOY_PATH/mail-service' '$DEPLOY_PATH/xxl-job'"
          scp -P "$VPS_PORT" compose.prod.yaml \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/compose.prod.yaml"
          scp -P "$VPS_PORT" backend/src/main/resources/db/*.sql backend/src/main/resources/db/*.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/backend/src/main/resources/db/"
          scp -P "$VPS_PORT" xxl-job/tables_xxl_job.sql \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/xxl-job/tables_xxl_job.sql"
          scp -P "$VPS_PORT" keycloak/workstation-realm.json \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/keycloak/workstation-realm.json"
          scp -P "$VPS_PORT" mail-service/init-database.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/mail-service/init-database.sh"

      - name: Pull and restart services
        shell: bash
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
          set -Eeuo pipefail
          image_tag="$1"
          cd /opt/workstation

          show_deployment_diagnostics() {
            exit_code="$?"
            if ((exit_code != 0)); then
              echo "Deployment failed with exit code ${exit_code}. Current container state:"
              IMAGE_TAG="$image_tag" docker compose \
                --env-file .env.docker \
                -f compose.prod.yaml \
                ps -a || true
              IMAGE_TAG="$image_tag" docker compose \
                --env-file .env.docker \
                -f compose.prod.yaml \
                logs --tail=100 db redis keycloak mail-service backend gateway web || true
            fi
            trap - EXIT
            exit "$exit_code"
          }
          trap show_deployment_diagnostics EXIT

          if [[ ! -f .env.docker ]]; then
            echo "/opt/workstation/.env.docker does not exist"
            exit 1
          fi

          # 历史部署可能把缺失文件创建成目录；启动前确认上传结果确实为文件。
          for source in backend/src/main/resources/db/*.sql backend/src/main/resources/db/*.sh \
            mail-service/init-database.sh xxl-job/tables_xxl_job.sql keycloak/workstation-realm.json; do
            if [[ ! -f "$source" ]]; then
              echo "部署文件缺失或路径为目录：$source"
              exit 1
            fi
          done

          IMAGE_TAG="$image_tag" docker compose \
            --env-file .env.docker \
            -f compose.prod.yaml \
            pull

          IMAGE_TAG="$image_tag" docker compose \
            --env-file .env.docker \
            -f compose.prod.yaml \
            up -d --remove-orphans

          IMAGE_TAG="$image_tag" docker compose \
            --env-file .env.docker \
            -f compose.prod.yaml \
            ps -a

          # 已有数据卷不会重跑初始化；缺表或缺列时明确失败，不自动迁移生产库。
          IMAGE_TAG="$image_tag" docker compose \
            --env-file .env.docker \
            -f compose.prod.yaml \
            exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' <<'SQL'
          SELECT id FROM integration_webhooks LIMIT 0;
          SELECT id FROM github_webhook_deliveries LIMIT 0;
          SELECT run_id FROM integration_issue_targets LIMIT 0;
          SELECT source_version FROM external_issue_sources LIMIT 0;
          SELECT confirmation_version FROM task_issue_links LIMIT 0;
          SELECT next_attempt_at, progress_json FROM integration_sync_runs LIMIT 0;
          SQL

          for attempt in {1..120}; do
            if IMAGE_TAG="$image_tag" docker compose \
              --env-file .env.docker \
              -f compose.prod.yaml \
                exec -T web wget -q -O /dev/null http://127.0.0.1:8080/api/auth/csrf &&
              IMAGE_TAG="$image_tag" docker compose \
                --env-file .env.docker \
                -f compose.prod.yaml \
                exec -T web wget -q -O /dev/null http://mail-service:8082/health &&
              IMAGE_TAG="$image_tag" docker compose \
                --env-file .env.docker \
                -f compose.prod.yaml \
                exec -T web wget -q -O /dev/null http://127.0.0.1:8080/auth/realms/workstation/.well-known/openid-configuration; then
              IMAGE_TAG="$image_tag" docker compose \
                --env-file .env.docker \
                -f compose.prod.yaml \
                ps
              exit 0
            fi
            sleep 3
          done

          echo "Deployment health check failed"
          exit 1
          REMOTE

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
