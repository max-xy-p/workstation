spring.application.name=workstation-mail-service
server.port=${MAIL_PORT:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=1MB
spring.datasource.url=${MAIL_DB_URL:jdbc:mysql://localhost:3306/workstation_mail?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${MAIL_DB_USERNAME:workstation_mail}
spring.datasource.password=${MAIL_DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
mail.keycloak-token=${MAIL_KEYCLOAK_TOKEN}
mail.backend-token=${MAIL_BACKEND_TOKEN}
mail.encryption-key=${MAIL_ENCRYPTION_KEY}
mail.resend-api-key=${RESEND_API_KEY}
mail.from=${MAIL_FROM:noreply@12718080.xyz}
mail.from-name=${MAIL_FROM_NAME:Workstation}
mail.reply-to=${MAIL_REPLY_TO:}
mail.worker-enabled=${MAIL_WORKER_ENABLED:true}
mail.webhook-secret=${RESEND_WEBHOOK_SECRET:}
