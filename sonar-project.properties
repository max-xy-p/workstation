sonar.projectKey=max-xy-p_workstation
sonar.organization=max-xy-p
sonar.sourceEncoding=UTF-8

# 从仓库根目录分析前端、两个 Java 模块和其他手写源码与配置；跳过自动生成的 SDK 文件。
sonar.sources=.
sonar.tests=backend/src/test,gateway/src/test,clients/typescript/test,clients/python-auth/tests
sonar.exclusions=backend/src/test/**,gateway/src/test/**,clients/typescript/test/**,clients/python-auth/tests/**,clients/python/**,clients/typescript/src/generated/**,clients/typescript/dist/**

# 覆盖率指标只评估两个 Java 模块；其他手写代码仍参与静态分析。
sonar.coverage.exclusions=frontend/**,clients/**,scripts/**

# Java 分析使用同一次 CI 作业中编译出的字节码。
sonar.java.source=17
sonar.java.binaries=backend/target/classes,gateway/target/classes
sonar.java.test.binaries=backend/target/test-classes,gateway/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml,gateway/target/site/jacoco/jacoco.xml

sonar.qualitygate.wait=true
