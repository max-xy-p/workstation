sonar.projectKey=max-xy-p_workstation
sonar.organization=max-xy-p
sonar.sourceEncoding=UTF-8

# 从仓库根目录分析前端、四个 Java 模块和其他手写源码与配置；跳过自动生成的 SDK 文件。
sonar.sources=.
sonar.tests=backend/src/test,gateway/src/test,mail-service/src/test,keycloak/mail-provider/src/test,clients/typescript/test,clients/python-auth/tests,frontend/tests
# 所有手写测试按测试代码分析；测试包含模式由扫描器自动从业务代码范围分离。
sonar.test.inclusions=backend/src/test/**,gateway/src/test/**,mail-service/src/test/**,keycloak/mail-provider/src/test/**,clients/typescript/test/**,clients/python-auth/tests/**,frontend/tests/**
sonar.exclusions=backend/src/test/**,gateway/src/test/**,mail-service/src/test/**,keycloak/mail-provider/src/test/**,clients/typescript/test/**,clients/python-auth/tests/**,clients/python/**,clients/typescript/src/generated/**,clients/typescript/dist/**

# 覆盖率评估四个 Java 模块；Backend/Gateway 另有合并 80% 检查。
sonar.coverage.exclusions=frontend/**,clients/**,scripts/**

# Java 分析使用同一次 CI 作业中编译出的字节码。
sonar.java.source=21
sonar.java.binaries=backend/target/classes,gateway/target/classes,mail-service/target/classes,keycloak/mail-provider/target/classes
sonar.java.test.binaries=backend/target/test-classes,gateway/target/test-classes,mail-service/target/test-classes,keycloak/mail-provider/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml,gateway/target/site/jacoco/jacoco.xml,mail-service/target/site/jacoco/jacoco.xml,keycloak/mail-provider/target/site/jacoco/jacoco.xml

sonar.qualitygate.wait=true
