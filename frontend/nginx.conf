map $http_x_forwarded_proto $workstation_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Docker 直接通过 localhost:8088 访问时，上游不会传 X-Forwarded-Port。
# 此时从 Host 请求头提取实际的外部端口。
map $http_host $workstation_host_port {
    default $server_port;
    ~*:(?<workstation_explicit_port>[0-9]+)$ $workstation_explicit_port;
}

# 生产环境优先使用宿主机 Nginx 提供的 X-Forwarded-Port；
# 本地直连时才使用从 Host 提取的端口。
map $http_x_forwarded_port $workstation_forwarded_port {
    default $http_x_forwarded_port;
    "" $workstation_host_port;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 仅此 POST 入口公开，由邮件服务验证 Resend 原文签名；内部发信接口没有公网路由。
    location = /mail/hooks/resend {
        limit_except POST { deny all; }
        client_max_body_size 100k;
        proxy_pass http://mail-service:8082/hooks/resend;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://gateway:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $workstation_forwarded_proto;
        proxy_set_header X-Forwarded-Port $workstation_forwarded_port;
    }

    location /oauth2/ {
        proxy_pass http://gateway:8081/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $workstation_forwarded_proto;
        proxy_set_header X-Forwarded-Port $workstation_forwarded_port;
    }

    location /login/oauth2/ {
        proxy_pass http://gateway:8081/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $workstation_forwarded_proto;
        proxy_set_header X-Forwarded-Port $workstation_forwarded_port;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $workstation_forwarded_proto;
        proxy_set_header X-Forwarded-Port $workstation_forwarded_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
