components:
  securitySchemes:
    workstationOAuth:
      type: oauth2
      description: Keycloak Client Credentials；Access Token 必须包含 workstation-api Audience 和 WORKSTATION_SERVICE Realm Role。
      flows:
        clientCredentials:
          tokenUrl: /auth/realms/workstation/protocol/openid-connect/token
          scopes: {}

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 从 0 开始的页码
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 每页数量
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求格式或业务校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Access Token 缺失、无效或过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: 调用方没有系统访问资格或 Workspace Permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: 版本、数据源配置或任务来源关联冲突；调用方应按错误码重新读取并处理本地操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    PrincipalType:
      type: string
      enum: [USER, SERVICE]
    WorkspaceType:
      type: string
      enum: [PERSONAL, SHARED]
    WorkspaceRole:
      type: string
      enum: [OWNER, ADMIN, EDITOR, VIEWER]
    WorkspacePermission:
      type: string
      enum:
        - WORKSPACE_READ
        - WORKSPACE_WRITE
        - MEMBER_READ
        - MEMBER_MANAGE
        - DASHBOARD_READ
        - NOTE_READ
        - NOTE_WRITE
        - NOTE_IMPORT
        - FOLDER_READ
        - FOLDER_WRITE
        - TAG_READ
        - TAG_WRITE
        - PROJECT_READ
        - PROJECT_WRITE
        - TASK_READ
        - TASK_WRITE
        - INTEGRATION_MANAGE
        - INTEGRATION_SYNC
        - AUDIT_READ
    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]

    WorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, type, role, permissions, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/WorkspaceType" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/WorkspacePermission" }
          uniqueItems: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [subjectId, role]
      properties:
        subjectId: { type: string, minLength: 1, maxLength: 255 }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceMemberCandidate:
      type: object
      additionalProperties: false
      required: [subjectId, username, displayName]
      properties:
        subjectId: { type: string }
        username: { type: string }
        displayName: { type: [string, "null"] }
    WorkspaceMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceMemberResponse:
      type: object
      additionalProperties: false
      required: [subjectId, principalType, username, displayName, role, joinedAt]
      properties:
        subjectId: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        username: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }
    AuditEventResponse:
      type: object
      additionalProperties: false
      required: [id, actorSubject, actorType, action, resourceType, resourceId, result, occurredAt, traceId]
      properties:
        id: { type: integer, format: int64 }
        actorSubject: { type: string }
        actorType: { $ref: "#/components/schemas/PrincipalType" }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [integer, "null"], format: int64 }
        result: { $ref: "#/components/schemas/AuditResult" }
        occurredAt: { type: string, format: date-time }
        traceId: { type: [string, "null"] }
    AuditEventPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEventResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }

    ProjectStatus:
      type: string
      enum: [PLANNING, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    NoteImportDuplicateStrategy:
      type: string
      enum: [CREATE_NEW, SKIP_TITLE]
    NoteImportStatus:
      type: string
      enum: [IMPORTED, SKIPPED, FAILED]

    TagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    TagResponse:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteRequest:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          description: Markdown 正文
        folderId:
          type: [integer, "null"]
          format: int64
        projectId:
          type: [integer, "null"]
          format: int64
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
    NoteUpdateRequest:
      type: object
      additionalProperties: false
      required: [title, content, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1 }
        folderId: { type: [integer, "null"], format: int64 }
        projectId: { type: [integer, "null"], format: int64 }
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    NoteRevisionSource:
      type: string
      enum: [CREATE, IMPORT, UPDATE, RESTORE, BASELINE]
    NoteRevisionRestoreRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    NoteRevisionSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, noteId, noteVersion, title, actorSubject, actorDisplayName, createdAt, source, restoredFromRevisionId]
      properties:
        id: { type: integer, format: int64 }
        noteId: { type: integer, format: int64 }
        noteVersion: { type: integer, format: int64, minimum: 1 }
