openapi: 3.1.2
info:
  title: Workstation API
  version: 5.0.0
  description: |
    Workstation 业务 HTTP API。Python 客户端使用 OAuth2 Client Credentials 获取
    Access Token，并携带 Bearer Token 通过 Gateway 访问这些接口。除系统角色准入外，
    所有业务操作还必须通过 Backend 的 Workspace 成员与 Permission 校验。
servers:
  - url: http://localhost:8088
    description: Local Docker Compose
tags:
  - name: workspaces
  - name: workspace-members
  - name: audit
  - name: integrations
  - name: dashboard
  - name: notes
  - name: note-folders
  - name: projects
  - name: tasks
  - name: tags
security:
  - workstationOAuth: []
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: 查询当前主体可访问的工作空间
      responses:
        "200":
          description: 工作空间列表；用户首次调用时会幂等创建个人工作空间
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: 创建共享工作空间
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "201":
          description: 创建者为 Owner 的共享工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: 查询工作空间
      responses:
        "200":
          description: 工作空间及当前主体权限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: 更新工作空间
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "200":
          description: 更新后的工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspace-members]
      operationId: listWorkspaceMembers
      summary: 查询工作空间成员
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [workspace-members]
      operationId: addWorkspaceMember
      summary: 添加工作空间成员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberRequest" }
      responses:
        "201":
          description: 新增的成员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspace-members]
      operationId: findWorkspaceMemberCandidate
      summary: 按用户名或显示名称模糊查询已登录过的用户
      parameters:
        - name: username
          in: query
          description: 去除首尾空白后按用户名或显示名称包含匹配，不区分大小写；最多返回 10 个用户，仅成员管理员可查询
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: 匹配的用户主体；不存在时返回空列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMemberCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members/{subjectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: subjectId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    put:
      tags: [workspace-members]
      operationId: updateWorkspaceMember
      summary: 更新成员角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberRoleRequest" }
      responses:
        "200":
          description: 更新后的成员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspace-members]
      operationId: removeWorkspaceMember
      summary: 移除工作空间成员
      responses:
        "204": { description: 移除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: 分页查询工作空间审计事件
      parameters:
        - name: actorSubject
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { $ref: "#/components/schemas/AuditResult" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 审计事件分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 查询工作台概览
      responses:
        "200":
          description: 概览统计和最近记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [notes]
      operationId: listNotes
      summary: 分页查询笔记
      parameters:
        - name: keyword
          in: query
          description: 标题或正文关键字
          schema: { type: string }
        - name: folderId
          in: query
          schema: { type: integer, format: int64 }
        - name: tagId
          in: query
          schema: { type: integer, format: int64 }
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 笔记分页，不包含 Markdown 正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePageResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notes]
      operationId: createNote
      summary: 创建笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: 创建后的笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [notes]
      operationId: getNote
      summary: 查询笔记详情
      responses:
        "200":
          description: 笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      operationId: updateNote
      summary: 完整更新笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdateRequest"
      responses:
        "200":
          description: 更新后的笔记详情；version 已递增
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: 将笔记移入回收站
      responses:
        "204":
          description: 已移入回收站
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/trash:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [notes]
      operationId: listDeletedNotes
      summary: 分页查询回收站笔记
      parameters:
        - name: keyword
          in: query
          description: 标题或正文关键字
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 按删除时间倒序排列的回收站笔记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedNotePageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [notes]
      operationId: restoreNote
      summary: 从回收站恢复笔记
      responses:
        "200":
          description: 已恢复的笔记详情；version 已递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/{id}/permanent:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [notes]
      operationId: permanentlyDeleteNote
      summary: 永久删除回收站中的笔记
      responses:
        "204":
          description: 永久删除成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [notes]
      operationId: listNoteRevisions
      summary: 分页查看笔记标题与正文历史
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: upToVersion
          in: query
          required: false
          description: 固定历史分页的版本上界；省略时使用请求时的当前版本
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 不包含正文的历史摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteRevisionPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/{id}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
      - name: revisionId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [notes]
      operationId: getNoteRevision
      summary: 查看当前笔记的一份完整历史快照
      responses:
        "200":
          description: 历史标题、正文与记录信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteRevisionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/{id}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
      - name: revisionId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [notes]
      operationId: restoreNoteRevision
      summary: 将历史标题和正文恢复为新版本，保留当前关联关系
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteRevisionRestoreRequest" }
      responses:
        "200":
          description: 已恢复的当前笔记，版本已递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/workspaces/{workspaceId}/notes/import:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [notes]
      operationId: importNotes
      summary: 从 Backend 可访问的路径导入 Markdown
      description: sourcePath 指向 Backend 主机或容器中的路径，不是 Python 客户端本机路径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteImportRequest"
      responses:
        "200":
          description: 导入汇总和逐文件结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteImportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/note-folders:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [note-folders]
      operationId: listNoteFolders
      summary: 查询全部笔记文件夹
      responses:
        "200":
          description: 按当前后端顺序返回的扁平文件夹列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [note-folders]
      operationId: createNoteFolder
      summary: 创建笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "201":
          description: 创建后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/note-folders/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [note-folders]
      operationId: getNoteFolder
      summary: 查询笔记文件夹
      responses:
        "200":
          description: 文件夹详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [note-folders]
      operationId: updateNoteFolder
      summary: 更新笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "200":
          description: 更新后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [note-folders]
      operationId: deleteNoteFolder
      summary: 删除空文件夹
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [projects]
      operationId: listProjects
      summary: 分页查询项目
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 项目分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      operationId: createProject
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "201":
          description: 创建后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [projects]
      operationId: getProjectDetail
      summary: 查询项目及关联任务和笔记
      responses:
        "200":
          description: 项目详情聚合
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: updateProject
      summary: 完整更新项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
