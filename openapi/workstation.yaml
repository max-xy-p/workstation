openapi: 3.1.2
info:
  title: Workstation API
  version: 1.0.0
  description: |
    Workstation 业务 HTTP API。Python 客户端使用 OAuth2 Client Credentials 获取
    Access Token，并携带 Bearer Token 通过 Gateway 访问这些接口。
servers:
  - url: http://localhost:8088
    description: Local Docker Compose
tags:
  - name: dashboard
  - name: notes
  - name: note-folders
  - name: projects
  - name: tasks
  - name: tags
security:
  - workstationOAuth: []
paths:
  /api/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 查询工作台概览
      responses:
        "200":
          description: 概览统计和最近记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: 分页查询笔记
      parameters:
        - name: keyword
          in: query
          description: 标题或正文关键字
          schema: { type: string }
        - name: folderId
          in: query
          schema: { type: integer, format: int64 }
        - name: tagId
          in: query
          schema: { type: integer, format: int64 }
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 笔记分页，不包含 Markdown 正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePageResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notes]
      operationId: createNote
      summary: 创建笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: 创建后的笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [notes]
      operationId: getNote
      summary: 查询笔记详情
      responses:
        "200":
          description: 笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      operationId: updateNote
      summary: 完整更新笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: 更新后的笔记详情；version 已递增
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: 删除笔记
      responses:
        "204":
          description: 删除成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notes/import:
    post:
      tags: [notes]
      operationId: importNotes
      summary: 从 Backend 可访问的路径导入 Markdown
      description: sourcePath 指向 Backend 主机或容器中的路径，不是 Python 客户端本机路径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteImportRequest"
      responses:
        "200":
          description: 导入汇总和逐文件结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteImportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/note-folders:
    get:
      tags: [note-folders]
      operationId: listNoteFolders
      summary: 查询全部笔记文件夹
      responses:
        "200":
          description: 按当前后端顺序返回的扁平文件夹列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [note-folders]
      operationId: createNoteFolder
      summary: 创建笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "201":
          description: 创建后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/note-folders/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [note-folders]
      operationId: getNoteFolder
      summary: 查询笔记文件夹
      responses:
        "200":
          description: 文件夹详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [note-folders]
      operationId: updateNoteFolder
      summary: 更新笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "200":
          description: 更新后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [note-folders]
      operationId: deleteNoteFolder
      summary: 删除空文件夹
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 分页查询项目
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 项目分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      operationId: createProject
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "201":
          description: 创建后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [projects]
      operationId: getProjectDetail
      summary: 查询项目及关联任务和笔记
      responses:
        "200":
          description: 项目详情聚合
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: updateProject
      summary: 完整更新项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [projects]
      operationId: updateProjectStatus
      summary: 更新项目状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectStatusRequest" }
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 分页查询任务
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/TaskPriority" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: 创建任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "201":
          description: 创建后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: 查询任务
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tasks]
      operationId: updateTask
      summary: 完整更新任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: 删除任务
      responses:
        "204": { description: 删除成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [tasks]
      operationId: updateTaskStatus
      summary: 更新任务状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskStatusRequest" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: 查询全部标签
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tags]
      operationId: createTag
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "201":
          description: 创建后的标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [tags]
      operationId: getTag
      summary: 查询标签
      responses:
        "200":
          description: 标签详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tags]
      operationId: updateTag
      summary: 更新标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "200":
          description: 更新后的标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: 删除标签
      responses:
        "204": { description: 删除成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    workstationOAuth:
      type: oauth2
      description: Keycloak Client Credentials；Access Token 必须包含 workstation-api Audience 和 OWNER Realm Role。
      flows:
        clientCredentials:
          tokenUrl: /auth/realms/workstation/protocol/openid-connect/token
          scopes: {}

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 从 0 开始的页码
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 每页数量
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求格式或业务校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Access Token 缺失、无效或过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Token 没有 OWNER 权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    ProjectStatus:
      type: string
      enum: [PLANNING, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    NoteImportDuplicateStrategy:
      type: string
      enum: [CREATE_NEW, SKIP_TITLE]
    NoteImportStatus:
      type: string
      enum: [IMPORTED, SKIPPED, FAILED]

    TagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    TagResponse:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteRequest:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          description: Markdown 正文
        folderId:
          type: [integer, "null"]
          format: int64
        projectId:
          type: [integer, "null"]
          format: int64
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []

    NoteSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, title, folderId, folderName, projectId, projectName, version, tags, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        folderId: { type: [integer, "null"], format: int64 }
        folderName: { type: [string, "null"] }
        projectId: { type: [integer, "null"], format: int64 }
        projectName: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 1 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteDetailResponse:
      type: object
      additionalProperties: false
      required: [id, title, content, folderId, folderName, projectId, projectName, version, tags, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string, description: Markdown 正文 }
        folderId: { type: [integer, "null"], format: int64 }
        folderName: { type: [string, "null"] }
        projectId: { type: [integer, "null"], format: int64 }
        projectName: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 1 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteImportRequest:
      type: object
      additionalProperties: false
      required: [sourcePath, duplicateStrategy]
      properties:
        sourcePath:
          type: string
          minLength: 1
          description: Backend 主机或容器可访问且位于白名单内的路径
        folderId: { type: [integer, "null"], format: int64 }
        projectId: { type: [integer, "null"], format: int64 }
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
        duplicateStrategy: { $ref: "#/components/schemas/NoteImportDuplicateStrategy" }
    NoteImportItemResponse:
      type: object
      additionalProperties: false
      required: [filePath, title, status, message, noteId]
      properties:
        filePath: { type: string }
        title: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/NoteImportStatus" }
        message: { type: [string, "null"] }
        noteId: { type: [integer, "null"], format: int64 }
    NoteImportResponse:
      type: object
      additionalProperties: false
      required: [importedCount, skippedCount, failedCount, items]
      properties:
        importedCount: { type: integer, format: int32, minimum: 0 }
        skippedCount: { type: integer, format: int32, minimum: 0 }
        failedCount: { type: integer, format: int32, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteImportItemResponse" }

    NoteFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        parentId: { type: [integer, "null"], format: int64 }
    NoteFolderResponse:
      type: object
      additionalProperties: false
