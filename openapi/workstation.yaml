openapi: 3.1.2
info:
  title: Workstation API
  version: 3.1.0
  description: |
    Workstation 业务 HTTP API。Python 客户端使用 OAuth2 Client Credentials 获取
    Access Token，并携带 Bearer Token 通过 Gateway 访问这些接口。除系统角色准入外，
    所有业务操作还必须通过 Backend 的 Workspace 成员与 Permission 校验。
servers:
  - url: http://localhost:8088
    description: Local Docker Compose
tags:
  - name: workspaces
  - name: workspace-members
  - name: audit
  - name: dashboard
  - name: notes
  - name: note-folders
  - name: projects
  - name: tasks
  - name: tags
security:
  - workstationOAuth: []
paths:
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: 查询当前主体可访问的工作空间
      responses:
        "200":
          description: 工作空间列表；用户首次调用时会幂等创建个人工作空间
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: 创建共享工作空间
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "201":
          description: 创建者为 Owner 的共享工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: 查询工作空间
      responses:
        "200":
          description: 工作空间及当前主体权限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: 更新工作空间
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "200":
          description: 更新后的工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspace-members]
      operationId: listWorkspaceMembers
      summary: 查询工作空间成员
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [workspace-members]
      operationId: addWorkspaceMember
      summary: 添加工作空间成员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberRequest" }
      responses:
        "201":
          description: 新增的成员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspace-members]
      operationId: findWorkspaceMemberCandidate
      summary: 按精确用户名查询已登录过的用户
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: 匹配的用户主体；不存在时返回空列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMemberCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members/{subjectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: subjectId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    put:
      tags: [workspace-members]
      operationId: updateWorkspaceMember
      summary: 更新成员角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberRoleRequest" }
      responses:
        "200":
          description: 更新后的成员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspace-members]
      operationId: removeWorkspaceMember
      summary: 移除工作空间成员
      responses:
        "204": { description: 移除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: 分页查询工作空间审计事件
      parameters:
        - name: actorSubject
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { $ref: "#/components/schemas/AuditResult" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 审计事件分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 查询工作台概览
      responses:
        "200":
          description: 概览统计和最近记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [notes]
      operationId: listNotes
      summary: 分页查询笔记
      parameters:
        - name: keyword
          in: query
          description: 标题或正文关键字
          schema: { type: string }
        - name: folderId
          in: query
          schema: { type: integer, format: int64 }
        - name: tagId
          in: query
          schema: { type: integer, format: int64 }
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 笔记分页，不包含 Markdown 正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePageResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notes]
      operationId: createNote
      summary: 创建笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: 创建后的笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [notes]
      operationId: getNote
      summary: 查询笔记详情
      responses:
        "200":
          description: 笔记详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      operationId: updateNote
      summary: 完整更新笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdateRequest"
      responses:
        "200":
          description: 更新后的笔记详情；version 已递增
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: 将笔记移入回收站
      responses:
        "204":
          description: 已移入回收站
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/trash:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [notes]
      operationId: listDeletedNotes
      summary: 分页查询回收站笔记
      parameters:
        - name: keyword
          in: query
          description: 标题或正文关键字
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 按删除时间倒序排列的回收站笔记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedNotePageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/notes/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [notes]
      operationId: restoreNote
      summary: 从回收站恢复笔记
      responses:
        "200":
          description: 已恢复的笔记详情；version 已递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/{id}/permanent:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [notes]
      operationId: permanentlyDeleteNote
      summary: 永久删除回收站中的笔记
      responses:
        "204":
          description: 永久删除成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/notes/import:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [notes]
      operationId: importNotes
      summary: 从 Backend 可访问的路径导入 Markdown
      description: sourcePath 指向 Backend 主机或容器中的路径，不是 Python 客户端本机路径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteImportRequest"
      responses:
        "200":
          description: 导入汇总和逐文件结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteImportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/note-folders:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [note-folders]
      operationId: listNoteFolders
      summary: 查询全部笔记文件夹
      responses:
        "200":
          description: 按当前后端顺序返回的扁平文件夹列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [note-folders]
      operationId: createNoteFolder
      summary: 创建笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "201":
          description: 创建后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/note-folders/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [note-folders]
      operationId: getNoteFolder
      summary: 查询笔记文件夹
      responses:
        "200":
          description: 文件夹详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [note-folders]
      operationId: updateNoteFolder
      summary: 更新笔记文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderRequest" }
      responses:
        "200":
          description: 更新后的文件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFolderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [note-folders]
      operationId: deleteNoteFolder
      summary: 删除空文件夹
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [projects]
      operationId: listProjects
      summary: 分页查询项目
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 项目分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      operationId: createProject
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "201":
          description: 创建后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [projects]
      operationId: getProjectDetail
      summary: 查询项目及关联任务和笔记
      responses:
        "200":
          description: 项目详情聚合
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: updateProject
      summary: 完整更新项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目
      responses:
        "204": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/projects/{id}/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [projects]
      operationId: updateProjectStatus
      summary: 更新项目状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectStatusRequest" }
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 分页查询任务
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/TaskPriority" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: 创建任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "201":
          description: 创建后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: 查询任务
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tasks]
      operationId: updateTask
      summary: 完整更新任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: 删除任务
      responses:
        "204": { description: 删除成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/tasks/{id}/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [tasks]
      operationId: updateTaskStatus
      summary: 更新任务状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskStatusRequest" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/tags:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [tags]
      operationId: listTags
      summary: 查询全部标签
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tags]
      operationId: createTag
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "201":
          description: 创建后的标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [tags]
      operationId: getTag
      summary: 查询标签
      responses:
        "200":
          description: 标签详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tags]
      operationId: updateTag
      summary: 更新标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "200":
          description: 更新后的标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: 删除标签
      responses:
        "204": { description: 删除成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    workstationOAuth:
      type: oauth2
      description: Keycloak Client Credentials；Access Token 必须包含 workstation-api Audience 和 WORKSTATION_SERVICE Realm Role。
      flows:
        clientCredentials:
          tokenUrl: /auth/realms/workstation/protocol/openid-connect/token
          scopes: {}

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 从 0 开始的页码
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 每页数量
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求格式或业务校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Access Token 缺失、无效或过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: 调用方没有系统访问资格或 Workspace Permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: 笔记版本冲突，调用方应重新读取并处理本地修改
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    PrincipalType:
      type: string
      enum: [USER, SERVICE]
    WorkspaceType:
      type: string
      enum: [PERSONAL, SHARED]
    WorkspaceRole:
      type: string
      enum: [OWNER, ADMIN, EDITOR, VIEWER]
    WorkspacePermission:
      type: string
      enum:
        - WORKSPACE_READ
        - WORKSPACE_WRITE
        - MEMBER_READ
        - MEMBER_MANAGE
        - DASHBOARD_READ
        - NOTE_READ
        - NOTE_WRITE
        - NOTE_IMPORT
        - FOLDER_READ
        - FOLDER_WRITE
        - TAG_READ
        - TAG_WRITE
        - PROJECT_READ
        - PROJECT_WRITE
        - TASK_READ
        - TASK_WRITE
        - AUDIT_READ
    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]

    WorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, type, role, permissions, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/WorkspaceType" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/WorkspacePermission" }
          uniqueItems: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [subjectId, role]
      properties:
        subjectId: { type: string, minLength: 1, maxLength: 255 }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceMemberCandidate:
      type: object
      additionalProperties: false
      required: [subjectId, username, displayName]
      properties:
        subjectId: { type: string }
        username: { type: string }
        displayName: { type: [string, "null"] }
    WorkspaceMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceMemberResponse:
      type: object
      additionalProperties: false
      required: [subjectId, principalType, username, displayName, role, joinedAt]
      properties:
        subjectId: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        username: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }
    AuditEventResponse:
      type: object
      additionalProperties: false
      required: [id, actorSubject, actorType, action, resourceType, resourceId, result, occurredAt, traceId]
      properties:
        id: { type: integer, format: int64 }
        actorSubject: { type: string }
        actorType: { $ref: "#/components/schemas/PrincipalType" }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [integer, "null"], format: int64 }
        result: { $ref: "#/components/schemas/AuditResult" }
        occurredAt: { type: string, format: date-time }
        traceId: { type: [string, "null"] }
    AuditEventPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEventResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }

    ProjectStatus:
      type: string
      enum: [PLANNING, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    NoteImportDuplicateStrategy:
      type: string
      enum: [CREATE_NEW, SKIP_TITLE]
    NoteImportStatus:
      type: string
      enum: [IMPORTED, SKIPPED, FAILED]

    TagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    TagResponse:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteRequest:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          description: Markdown 正文
        folderId:
          type: [integer, "null"]
          format: int64
        projectId:
          type: [integer, "null"]
          format: int64
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
    NoteUpdateRequest:
      type: object
      additionalProperties: false
      required: [title, content, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1 }
        folderId: { type: [integer, "null"], format: int64 }
        projectId: { type: [integer, "null"], format: int64 }
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    NoteSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, title, folderId, folderName, projectId, projectName, version, tags, excerpt, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        folderId: { type: [integer, "null"], format: int64 }
        folderName: { type: [string, "null"] }
        projectId: { type: [integer, "null"], format: int64 }
        projectName: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 1 }
        excerpt:
          type: [string, "null"]
          description: 关键词搜索时的正文片段，最长 200 字符；其他摘要查询为空
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteDetailResponse:
      type: object
      additionalProperties: false
      required: [id, title, content, folderId, folderName, projectId, projectName, version, tags, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string, description: Markdown 正文 }
        folderId: { type: [integer, "null"], format: int64 }
        folderName: { type: [string, "null"] }
        projectId: { type: [integer, "null"], format: int64 }
        projectName: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 1 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeletedNoteResponse:
      type: object
      additionalProperties: false
      required: [id, title, excerpt, folderId, folderName, projectId, projectName, version, tags, deletedAt, deletedBySubject, deletedByDisplayName]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        excerpt:
          type: [string, "null"]
          description: Markdown 正文开头或关键词附近的片段，最长 200 字符
        folderId: { type: [integer, "null"], format: int64 }
        folderName: { type: [string, "null"] }
        projectId: { type: [integer, "null"], format: int64 }
        projectName: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 1 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        deletedAt: { type: string, format: date-time }
        deletedBySubject: { type: string }
        deletedByDisplayName: { type: [string, "null"] }

    NoteImportRequest:
      type: object
      additionalProperties: false
      required: [sourcePath, duplicateStrategy]
      properties:
        sourcePath:
          type: string
          minLength: 1
          description: Backend 主机或容器可访问且位于白名单内的路径
        folderId: { type: [integer, "null"], format: int64 }
        projectId: { type: [integer, "null"], format: int64 }
        tagIds:
          type: array
          items: { type: integer, format: int64 }
          uniqueItems: true
          default: []
        duplicateStrategy: { $ref: "#/components/schemas/NoteImportDuplicateStrategy" }
    NoteImportItemResponse:
      type: object
      additionalProperties: false
      required: [filePath, title, status, message, noteId]
      properties:
        filePath: { type: string }
        title: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/NoteImportStatus" }
        message: { type: [string, "null"] }
        noteId: { type: [integer, "null"], format: int64 }
    NoteImportResponse:
      type: object
      additionalProperties: false
      required: [importedCount, skippedCount, failedCount, items]
      properties:
        importedCount: { type: integer, format: int32, minimum: 0 }
        skippedCount: { type: integer, format: int32, minimum: 0 }
        failedCount: { type: integer, format: int32, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteImportItemResponse" }

    NoteFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        parentId: { type: [integer, "null"], format: int64 }
    NoteFolderResponse:
      type: object
      additionalProperties: false
      required: [id, name, parentId, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        repositoryUrl: { type: [string, "null"], maxLength: 500 }
        techStack: { type: [string, "null"], maxLength: 500 }
        runGuide: { type: [string, "null"] }
    ProjectSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, name, description, status, repositoryUrl, techStack, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        repositoryUrl: { type: [string, "null"] }
        techStack: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [id, name, description, status, repositoryUrl, techStack, runGuide, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        repositoryUrl: { type: [string, "null"] }
        techStack: { type: [string, "null"] }
        runGuide: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ProjectStatus" }
    ProjectDetailResponse:
      type: object
      additionalProperties: false
      required: [project, tasks, notes]
      properties:
        project: { $ref: "#/components/schemas/ProjectResponse" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskResponse" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/NoteSummaryResponse" }

    TaskRequest:
      type: object
      additionalProperties: false
      required: [title, projectId, status, priority]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        projectId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate: { type: [string, "null"], format: date }
        evidenceNoteId: { type: [integer, "null"], format: int64 }
    TaskResponse:
      type: object
      additionalProperties: false
      required: [id, title, description, projectId, projectName, status, priority, dueDate, evidenceNoteId, evidenceNoteTitle, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, "null"] }
        projectId: { type: integer, format: int64 }
        projectName: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate: { type: [string, "null"], format: date }
        evidenceNoteId: { type: [integer, "null"], format: int64 }
        evidenceNoteTitle: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TaskStatus" }

    DashboardResponse:
      type: object
      additionalProperties: false
      required: [activeProjectCount, todoTaskCount, inProgressTaskCount, recentProjects, recentNotes]
      properties:
        activeProjectCount: { type: integer, format: int64, minimum: 0 }
        todoTaskCount: { type: integer, format: int64, minimum: 0 }
        inProgressTaskCount: { type: integer, format: int64, minimum: 0 }
        recentProjects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummaryResponse" }
        recentNotes:
          type: array
          items: { $ref: "#/components/schemas/NoteSummaryResponse" }

    NotePageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteSummaryResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
    DeletedNotePageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeletedNoteResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
    ProjectPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummaryResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
    TaskPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskResponse" }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
