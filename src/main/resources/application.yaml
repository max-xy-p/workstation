server:
  port: ${SERVER_PORT}

spring:
  application:
    name: workstation
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
mybatis:
  configuration:
    map-underscore-to-camel-case: true

workstation:
  dashboard:
    recent-limit: ${DASHBOARD_RECENT_LIMIT}
  note-import:
    allowed-roots: ${NOTE_IMPORT_ALLOWED_ROOTS}
    max-file-bytes: ${NOTE_IMPORT_MAX_FILE_BYTES}
