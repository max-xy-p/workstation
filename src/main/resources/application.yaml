server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: workstation
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
mybatis:
  configuration:
    map-underscore-to-camel-case: true

workstation:
  security:
    admin-username: ${APP_ADMIN_USERNAME}
    admin-password-hash: ${APP_ADMIN_PASSWORD_HASH}
  dashboard:
    recent-limit: ${DASHBOARD_RECENT_LIMIT}
  note-import:
    allowed-roots: ${NOTE_IMPORT_ALLOWED_ROOTS}
    max-file-bytes: ${NOTE_IMPORT_MAX_FILE_BYTES}
