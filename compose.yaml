name: workstation

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--sql-generate-invisible-primary-key=OFF"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workstation}
      MYSQL_USER: ${MYSQL_USER:-workstation}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 一次性初始化任务：在同一个 MySQL 实例中为 Keycloak 创建独立数据库和账号。
  keycloak-db-init:
    image: mysql:8.4
    restart: "no"
    entrypoint: ["/bin/bash", "/init/init-keycloak-database.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.docker}
    volumes:
      - ./deployment/mysql/init-keycloak-database.sh:/init/init-keycloak-database.sh:ro
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname=${WORKSTATION_PUBLIC_URL:-http://localhost:8088}/auth
    environment:
      # Keycloak 与业务后端共用 MySQL 服务，但使用 keycloak 数据库和独立账号。
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/keycloak?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.docker}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env.docker}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.docker}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env.docker}
      WORKSTATION_PUBLIC_URL: ${WORKSTATION_PUBLIC_URL:-http://localhost:8088}
      WORKSTATION_DEV_URL: ${WORKSTATION_DEV_URL:-http://localhost:5173}
      WORKSTATION_OWNER_USERNAME: ${WORKSTATION_OWNER_USERNAME:-owner}
      WORKSTATION_OWNER_INITIAL_PASSWORD: ${WORKSTATION_OWNER_INITIAL_PASSWORD:?Set WORKSTATION_OWNER_INITIAL_PASSWORD in .env.docker}
    volumes:
      - ./keycloak/workstation-realm.json:/opt/keycloak/data/import/workstation-realm.json:ro
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-workstation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-workstation}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      KEYCLOAK_ISSUER_URI: ${WORKSTATION_PUBLIC_URL:-http://localhost:8088}/auth/realms/workstation
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/workstation/protocol/openid-connect/certs
      OAUTH2_AUDIENCE: workstation-api
      DASHBOARD_RECENT_LIMIT: ${DASHBOARD_RECENT_LIMIT:-5}
      NOTE_IMPORT_ALLOWED_ROOTS: /data/notes
      NOTE_IMPORT_MAX_FILE_BYTES: ${NOTE_IMPORT_MAX_FILE_BYTES:-1048576}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./notes:/data/notes
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8081
      BACKEND_BASE_URL: http://backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env.docker}
      WORKSTATION_PUBLIC_URL: ${WORKSTATION_PUBLIC_URL:-http://localhost:8088}
      KEYCLOAK_PUBLIC_BASE_URL: ${WORKSTATION_PUBLIC_URL:-http://localhost:8088}/auth
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/auth
      SESSION_COOKIE_SECURE: "false"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      keycloak:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      - gateway
      - keycloak

volumes:
  mysql_data:
  redis_data:
